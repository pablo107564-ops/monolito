<style>
/* O GitHub Pages mostra esta página em qualquer endereço que não existe, então os links são completos. */
:root{
  color-scheme:light;
  --bg:#F4F6F5; --surface:#FFFFFF; --text:#0F1D1F; --muted:#5E6F72; --border:#DCE3E2;
  --agua:#0B5E66; --agua-contrast:#FFFFFF;
  --display:"Bricolage Grotesque", system-ui, sans-serif; --sans:"IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#0D1719; --surface:#142226; --text:#E7EEEE; --muted:#93A6A8; --border:#22363A; --agua:#5CC3C0; --agua-contrast:#08191B; }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#0D1719; --surface:#142226; --text:#E7EEEE; --muted:#93A6A8; --border:#22363A; --agua:#5CC3C0; --agua-contrast:#08191B; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:17px/1.6 var(--sans);padding:40px 16px}
main{max-width:520px;text-align:center}
.logo-bg{fill:var(--agua)} .logo-pedra{fill:var(--agua-contrast)} .logo-base{stroke:var(--agua-contrast)}
.cod{font-family:ui-monospace, monospace;letter-spacing:.12em;color:var(--agua);font-size:14px;margin:26px 0 8px;font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px, 7vw, 42px);line-height:1.1;letter-spacing:-.02em;margin:0}
p{color:var(--muted);margin:14px 0 0}
nav{display:flex;flex-direction:column;gap:10px;margin-top:30px}
a.op{display:block;padding:14px 18px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;font-weight:600}
a.op:hover{border-color:var(--agua)}
a.op.principal{background:var(--agua);border-color:var(--agua);color:var(--agua-contrast)}
a.op:focus-visible{outline:3px solid var(--text);outline-offset:2px}
</style>
<script>try{ var t = localStorage.getItem("mono-tema"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}</script>
</head>
